<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Versão vetorial simplificada da marca: coroa dourada sobre o duplo
       chevron do monograma KR. Usada só como fallback — os ícones principais
       são /icone-192.png e /icone-512.png, extraídos da arte original. -->
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD131" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B0B0D" />

  <!-- coroa -->
  <g fill="url(#ouro)">
    <path d="M23 21 L26.5 14 L32 18.5 L37.5 14 L41 21 Z" />
    <rect x="23" y="22.5" width="18" height="2.6" rx="1.3" />
    <circle cx="26.5" cy="12.5" r="1.9" />
    <circle cx="32" cy="16.5" r="1.9" />
    <circle cx="37.5" cy="12.5" r="1.9" />
  </g>

  <!-- canto dourado do K -->
  <path d="M13 28 L23 28 L13 38 Z" fill="url(#ouro)" />

  <!-- duplo chevron KR -->
  <g fill="#FFFFFF">
    <path d="M25 28 L15 41 L25 54 L33 54 L23 41 L33 28 Z" />
    <path d="M39 28 L29 41 L39 54 L47 54 L37 41 L47 28 Z" />
  </g>
</svg>
